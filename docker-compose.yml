services:
  backend:
    build: ./backend
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - ADMIN_SECRET=admin
      # Fixed seed for the public room's dungeon (empty/unset = deterministic crc32(game_id) fallback).
      # Set e.g. PUBLIC_ROOM_SEED=MAB to play a curated world that resets on server restart.
      - PUBLIC_ROOM_SEED=
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Don't overwrite node_modules with host mount
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8081
      - VITE_DEBUG_TILES='true'
